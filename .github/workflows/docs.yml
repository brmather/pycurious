name: Documentation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; do not cancel a run in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pycurious with docs extras
        # examples + mapping are needed so the tutorial notebooks execute at
        # build time (matplotlib/cartopy/pyproj/netCDF4).
        run: python -m pip install -e ".[docs,examples,mapping]"

      - name: Copy tutorial notebooks into the docs tree
        run: python docs/copy_notebooks.py

      - name: Build HTML
        # Not -W: the function docstrings are pdoc-flavoured Markdown that emits
        # cosmetic RST warnings under autodoc. The real quality gate is
        # nb_execution_raise_on_error in conf.py — a tutorial that fails to
        # execute fails the build.
        run: sphinx-build -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    # Only publish from master; PRs build above but do not deploy.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
